name: 构建系统镜像

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: '构建模式'
        required: true
        type: choice
        options:
          - single
          - parallel
        default: 'single'
      system_types:
        description: '系统类型 (用逗号分隔多个值，如: ubuntu-gnome,ubuntu-server)'
        required: false
        default: 'ubuntu-gnome'
        type: string
      kernel_versions:
        description: '内核版本 (从源码编译，默认7.3)'
        required: false
        default: '7.3'
        type: string
      bootstrap_tools:
        description: '构建工具 (用逗号分隔多个值，如: mmdebstrap)'
        required: false
        default: 'mmdebstrap'
        type: string
      desktop_environments:
        description: '桌面环境 (仅适用于Phosh版本)'
        required: false
        default: 'phosh-core'
        type: string
      debian_versions:
        description: 'Debian 版本 (用逗号分隔多个值，如: trixie,bookworm)'
        required: false
        default: 'trixie'
        type: string
      ubuntu_versions:
        description: 'Ubuntu 版本 (默认 noble = 24.04 LTS)'
        required: false
        default: 'noble'
        type: string

env:
  HOSTNAME: huliboot

permissions:
  contents: write

jobs:
  generate-matrix:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
      build_mode: ${{ steps.generate.outputs.build_mode }}
      single_system_type: ${{ steps.generate.outputs.single_system_type }}
      single_kernel_version: ${{ steps.generate.outputs.single_kernel_version }}
      single_os_version: ${{ steps.generate.outputs.single_os_version }}
    steps:
      - name: 生成构建矩阵
        id: generate
        run: |
          set -e

          BUILD_MODE="${{ github.event.inputs.build_mode }}"
          echo "build_mode=${BUILD_MODE}" >> $GITHUB_OUTPUT
          SYS_TYPES="${{ github.event.inputs.system_types }}"
          KERN_VERS="${{ github.event.inputs.kernel_versions }}"
          BOOT_TOOLS="${{ github.event.inputs.bootstrap_tools }}"
          DESKTOP_ENV="${{ github.event.inputs.desktop_environments }}"
          DEB_VERS="${{ github.event.inputs.debian_versions }}"
          UBU_VERS="${{ github.event.inputs.ubuntu_versions }}"

          if [ "$BUILD_MODE" = "single" ]; then
            SYS_TYPE=$(echo "$SYS_TYPES" | cut -d',' -f1)
            KERN_VER=$(echo "$KERN_VERS" | cut -d',' -f1)
            TOOL=$(echo "$BOOT_TOOLS" | cut -d',' -f1)

            if [[ "$SYS_TYPE" == debian-* ]]; then
              DEB_VER=$(echo "$DEB_VERS" | cut -d',' -f1)
              UBU_VER=""
              OS_VER="$DEB_VER"
            else
              DEB_VER=""
              UBU_VER=$(echo "$UBU_VERS" | cut -d',' -f1)
              OS_VER="$UBU_VER"
            fi

            echo "single_system_type=${SYS_TYPE}" >> $GITHUB_OUTPUT
            echo "single_kernel_version=${KERN_VER}" >> $GITHUB_OUTPUT
            echo "single_os_version=${OS_VER}" >> $GITHUB_OUTPUT

            MATRIX="[{\"system_type\":\"$SYS_TYPE\",\"kernel_version\":\"$KERN_VER\",\"bootstrap_tool\":\"$TOOL\",\"debian_version\":\"$DEB_VER\",\"ubuntu_version\":\"$UBU_VER\",\"desktop_env\":\"$DESKTOP_ENV\"}]"
          else
            MATRIX="["
            FIRST_ITEM=true

            IFS=',' read -ra SYS_ARRAY <<< "$SYS_TYPES"
            IFS=',' read -ra KERN_ARRAY <<< "$KERN_VERS"
            IFS=',' read -ra TOOL_ARRAY <<< "$BOOT_TOOLS"
            IFS=',' read -ra DEB_ARRAY <<< "$DEB_VERS"
            IFS=',' read -ra UBU_ARRAY <<< "$UBU_VERS"

            for sys in "${SYS_ARRAY[@]}"; do
              if [[ "$sys" == debian-* ]]; then
                for kern in "${KERN_ARRAY[@]}"; do
                  for tool in "${TOOL_ARRAY[@]}"; do
                    for deb_ver in "${DEB_ARRAY[@]}"; do
                      if [ "$FIRST_ITEM" = true ]; then FIRST_ITEM=false; else MATRIX="${MATRIX},"; fi
                      MATRIX="${MATRIX}{\"system_type\":\"$sys\",\"kernel_version\":\"$kern\",\"bootstrap_tool\":\"$tool\",\"debian_version\":\"$deb_ver\",\"ubuntu_version\":\"\",\"desktop_env\":\"$DESKTOP_ENV\"}"
                    done
                  done
                done
              fi
            done

            for sys in "${SYS_ARRAY[@]}"; do
              if [[ "$sys" == ubuntu-* ]]; then
                for kern in "${KERN_ARRAY[@]}"; do
                  for tool in "${TOOL_ARRAY[@]}"; do
                    for ubu_ver in "${UBU_ARRAY[@]}"; do
                      if [ "$FIRST_ITEM" = true ]; then FIRST_ITEM=false; else MATRIX="${MATRIX},"; fi
                      MATRIX="${MATRIX}{\"system_type\":\"$sys\",\"kernel_version\":\"$kern\",\"bootstrap_tool\":\"$tool\",\"debian_version\":\"\",\"ubuntu_version\":\"$ubu_ver\",\"desktop_env\":\"$DESKTOP_ENV\"}"
                    done
                  done
                done
              fi
            done

            MATRIX="${MATRIX}]"
          fi

          echo "Generated matrix: $MATRIX"
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  build:
    needs: generate-matrix
    name: ${{ format('构建 {0}-{1}', matrix.system_type, matrix.kernel_version) }}
    runs-on: ubuntu-24.04-arm
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    env:
      SYSTEM_TYPE: ${{ matrix.system_type }}
      KERNEL_VERSION: ${{ matrix.kernel_version }}
      BOOTSTRAP_TOOL: ${{ matrix.bootstrap_tool }}
      DESKTOP_ENV: ${{ matrix.desktop_env }}
      DEBIAN_VERSION: ${{ matrix.debian_version }}
      UBUNTU_VERSION: ${{ matrix.ubuntu_version }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装构建工具与内核编译依赖
        run: |
          echo "[$(date +'%Y-%m-%d %H:%M:%S')] 安装构建工具与内核/U-Boot 编译依赖..."
          sudo apt-get update
          sudo apt-get install -y mmdebstrap debootstrap ubuntu-keyring debian-archive-keyring \
            p7zip-full build-essential bc flex bison ccache clang lld llvm \
            libssl-dev libelf-dev libdw-dev debhelper rsync kmod cpio

          # 确保 loop 设备可用 (4096 扇区嵌套 GPT)
          sudo modprobe loop 2>/dev/null || true

          if [ "${{ env.BOOTSTRAP_TOOL }}" = "mmdebstrap" ]; then
            command -v mmdebstrap >/dev/null 2>&1 || { echo "mmdebstrap 安装失败"; exit 1; }
          else
            command -v debootstrap >/dev/null 2>&1 || sudo apt-get install -y debootstrap
          fi

      - name: 编译内核并从源码准备依赖
        run: |
          echo "本仓库从源码编译内核 (版本: ${{ env.KERNEL_VERSION }})..."
          bash scripts/00-download-deps.sh "${{ env.KERNEL_VERSION }}"
          echo "内核与固件素材准备完成"

      - name: 从源码编译 U-Boot
        run: |
          echo "本仓库从源码编译 U-Boot (GitHub Actions 内完成)..."
          bash scripts/build-uboot.sh
          ls -lh uboot-out/

      - name: 检查必要文件
        run: |
          echo "检查构建所需文件..."
          D="xiaomi-raphael-debs_${{ env.KERNEL_VERSION }}"
          for f in linux-image-xiaomi-raphael.deb linux-headers-xiaomi-raphael.deb firmware-xiaomi-raphael.deb; do
            if [ ! -f "$D/$f" ]; then echo "错误: $D/$f 不存在"; exit 1; fi
          done
          echo "所有必要文件存在"

      - name: 执行构建
        run: |
          set -e
          chmod +x build.sh
          sudo env SYSTEM_TYPE="${{ env.SYSTEM_TYPE }}" KERNEL_VERSION="${{ env.KERNEL_VERSION }}" \
            DEBIAN_VERSION="${{ env.DEBIAN_VERSION }}" UBUNTU_VERSION="${{ env.UBUNTU_VERSION }}" \
            BOOTSTRAP_TOOL="${{ env.BOOTSTRAP_TOOL }}" DESKTOP_ENV="${{ env.DESKTOP_ENV }}" \
            bash build.sh "${{ env.SYSTEM_TYPE }}" "${{ env.KERNEL_VERSION }}"

      - name: 生成产物文件名和校验和
        id: artifacts
        run: |
          OS_VER="${{ env.DEBIAN_VERSION || env.UBUNTU_VERSION }}"
          FILENAME="rootfs-${{ env.SYSTEM_TYPE }}-${{ env.KERNEL_VERSION }}-${OS_VER}"
          [[ "${{ env.SYSTEM_TYPE }}" == *"phosh"* ]] && FILENAME="${FILENAME}-${{ env.DESKTOP_ENV }}"

          echo "filename=${FILENAME}" >> $GITHUB_OUTPUT
          echo "artifact_name=${FILENAME}" >> $GITHUB_OUTPUT

          sha256sum rootfs.img > ${FILENAME}.sha256
          cat ${FILENAME}.sha256

      - name: 压缩镜像
        run: |
          FILENAME="${{ steps.artifacts.outputs.filename }}"
          echo "压缩为 ${FILENAME}.7z ..."
          7z a "${FILENAME}.7z" rootfs.img
          ls -lh "${FILENAME}.7z"
          rm -f rootfs.img

      - name: 生成 U-Boot 校验和
        run: |
          if [ -f uboot-out/u-boot-sm8150-xiaomi-raphael.zip ]; then
            sha256sum uboot-out/u-boot-sm8150-xiaomi-raphael.zip > uboot-out/u-boot-sm8150-xiaomi-raphael.zip.sha256
            cat uboot-out/u-boot-sm8150-xiaomi-raphael.zip.sha256
          fi

      - name: 上传产物到 Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.artifacts.outputs.artifact_name }}
          path: |
            ${{ steps.artifacts.outputs.filename }}.7z
            ${{ steps.artifacts.outputs.filename }}.sha256
            uboot-out/u-boot-sm8150-xiaomi-raphael.zip
            uboot-out/u-boot-sm8150-xiaomi-raphael.zip.sha256
          retention-days: 7

      - name: 清理临时文件
        if: always()
        run: |
          sudo losetup -D 2>/dev/null || true
          sudo rm -f alsa-xiaomi-raphael.deb 2>/dev/null || true
          sudo rm -rf rootdir 2>/dev/null || true
          rm -rf xiaomi-raphael-debs_* 2>/dev/null || true
          rm -f rootfs.img 2>/dev/null || true

  release:
    needs: [generate-matrix, build]
    if: github.event_name == 'workflow_dispatch' && needs.build.result == 'success'
    name: 发布统一 Release
    runs-on: ubuntu-24.04
    steps:
      - name: 下载所有产物
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: rootfs-*
          merge-multiple: false

      - name: 准备 Release 信息
        id: release-info
        run: |
          TIMESTAMP=$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')
          TAG="latest"
          RELEASE_TITLE="huliboot 镜像构建"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "name=${RELEASE_TITLE}" >> $GITHUB_OUTPUT
          echo "timestamp=${TIMESTAMP}" >> $GITHUB_OUTPUT

      - name: 生成 Release 描述和分类文件
        id: classify
        run: |
          TIMESTAMP="${{ steps.release-info.outputs.timestamp }}"
          ARTIFACTS_DIR="artifacts"
          RELEASE_DIR="release-files"
          mkdir -p "${RELEASE_DIR}"

          LARGE_FILES=""
          FILE_LIST=""
          SIZE_LIMIT=2147483648

          while IFS= read -r file; do
            [ -f "$file" ] || continue
            filename=$(basename "$file")
            filesize=$(stat -c%s "$file")

            IFS='-' read -ra PARTS <<< "${filename%.7z}"
            SYSTEM_TYPE="${PARTS[1]}"
            KERNEL_VER="${PARTS[2]}"
            OS_VER="${PARTS[3]}"

            shafile="${file%.7z}.sha256"
            if [ -f "$shafile" ]; then
              SHA256=$(awk 'NR==1 {print $1}' "$shafile")
            else
              SHA256=$(sha256sum "$file" | awk '{print $1}')
            fi

            if [ "$filesize" -gt "$SIZE_LIMIT" ]; then
              LARGE_FILES="${LARGE_FILES}
          - ${filename} (${filesize} bytes)"
              FILE_LIST="${FILE_LIST}
          - ⚠️ **${filename}** (文件过大，请从 Artifacts 下载)"
            else
              ln -sf "$(realpath "$file")" "${RELEASE_DIR}/${filename}"
              FILE_LIST="${FILE_LIST}
          - ✅ **${filename}**"
            fi

            SHA256_LIST="${SHA256_LIST}
          ${filename}: ${SHA256}"
          done < <(find "${ARTIFACTS_DIR}" -type f -name '*.7z')

          # U-Boot 固件：从任一 artifact 中取一份（各矩阵产物内容相同）
          UBOOT_ZIP=$(find "${ARTIFACTS_DIR}" -type f -name 'u-boot-sm8150-xiaomi-raphael.zip' | head -n 1 || true)
          UBOOT_SHA=""
          if [ -n "$UBOOT_ZIP" ]; then
            cp -f "$UBOOT_ZIP" "${RELEASE_DIR}/"
            UBOOT_SHA=$(sha256sum "$UBOOT_ZIP" | awk '{print $1}')
            FILE_LIST="${FILE_LIST}
          - ✅ **u-boot-sm8150-xiaomi-raphael.zip** (本仓库从源码编译)"
            SHA256_LIST="${SHA256_LIST}
          u-boot-sm8150-xiaomi-raphael.zip: ${UBOOT_SHA}"
          fi

          echo "要上传到 Release 的文件:"
          ls -la ${RELEASE_DIR}/

          echo "uboot_sha=${UBOOT_SHA}" >> $GITHUB_OUTPUT
          { echo "large_files<<EOF"; echo "$LARGE_FILES"; echo "EOF"; } >> $GITHUB_OUTPUT
          { echo "file_list<<EOF"; echo "$FILE_LIST"; echo "EOF"; } >> $GITHUB_OUTPUT
          { echo "sha256_list<<EOF"; echo "$SHA256_LIST"; echo "EOF"; } >> $GITHUB_OUTPUT

      - name: 创建 Release 描述
        id: description
        run: |
          TIMESTAMP="${{ steps.release-info.outputs.timestamp }}"
          FILE_LIST="${{ steps.classify.outputs.file_list }}"
          LARGE_FILES="${{ steps.classify.outputs.large_files }}"
          SHA256_LIST="${{ steps.classify.outputs.sha256_list }}"

          {
            echo "body<<EOF"
            echo "## huliboot (Redmi K20 Pro / 小米 9T Pro) Ubuntu 24.04 LTS 镜像"
            echo ""
            echo "> 内核与组件由本仓库从源码构建 - ${TIMESTAMP}"
            echo ""
            echo "### 📦 镜像列表"
            echo "| 文件名 | 系统类型 | 内核版本 | 系统版本 |"
            echo "|--------|----------|----------|----------|"
            echo "$FILE_LIST"
            echo ""
            echo "### 🔒 SHA256 校验和"
            echo "\`\`\`"
            echo "$SHA256_LIST"
            echo "\`\`\`"
            echo ""
            if [ -n "$LARGE_FILES" ]; then
              echo "### ⚠️ 大文件提示"
              echo "以下文件超过 2GB，未上传到 Release，请从 Artifacts 下载："
              echo "$LARGE_FILES"
              echo ""
            fi
            echo "### 🔑 默认凭据"
            echo "- **用户**: \`huliboot\` / **密码**: \`1234\`"
            echo "- **用户**: \`root\` / **密码**: \`1234\`"
            echo ""
            echo "### 🌐 网络连接 (USB NCM)"
            echo "- 设备 IP: \`172.16.42.1\`"
            echo "- SSH 命令: \`ssh huliboot@172.16.42.1\`"
            echo "- 默认 DNS: 阿里云 (\`223.5.5.5\` / \`223.6.6.6\`)"
            echo ""
            echo "---"
            echo "*内核与 U-Boot 由本仓库从源码构建 · Built with GitHub Actions*"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: 发布 Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release-info.outputs.tag }}
          name: ${{ steps.release-info.outputs.name }}
          body: ${{ steps.description.outputs.body }}
          draft: false
          prerelease: false
          files: |
            release-files/*.7z
            release-files/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
